<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#214d3e">
  <title>Le Carnet du code — Parcours Python</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Accueil du Carnet du code">
      <span class="brand-mark" aria-hidden="true">&lt;/&gt;</span>
      <span>Le Carnet du code</span>
    </a>
    <div class="top-course"><span class="top-dot"></span><strong id="courseName">Parcours Python</strong><span class="slash">/</span><span>Apprendre en construisant</span></div>
    <div class="top-right"><span id="headerProgress">0 / 5 étapes</span><span class="avatar" aria-label="Profil">MA</span></div>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <p class="side-label">Ton parcours</p>
      <h2 class="course-name">Python, pas à pas</h2>
      <p class="course-meta">5 étapes · projet console</p>
      <div class="progress-block">
        <div class="progress-line"><span>Progression</span><span id="progressText">0 %</span></div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </div>
      <p class="side-label">Les étapes</p>
      <nav class="lesson-nav" id="lessonNav" aria-label="Leçons du parcours"></nav>
    </aside>
    <main id="main" tabindex="-1"><p class="loading">Chargement du parcours…</p></main>
  </div>
</body>
</html>
